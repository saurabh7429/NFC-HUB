<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Watch — Style On Your Time</title>
  <link rel="stylesheet" href="style.css?v=2">
  <noscript>
    <style>
      .loading-state { display: none !important; }
      .noscript-notice {
        display: block !important;
        padding: 32px 20px;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        color: #0f172a;
        text-align: center;
        margin: 20px auto;
        max-width: 440px;
      }
      .noscript-notice a {
        display: block;
        margin-top: 10px;
        padding: 12px 16px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </noscript>
</head>
<body>
  <div id="app" class="site-container">
    <!-- Non-JavaScript Fallback -->
    <noscript>
      <div class="noscript-notice">
        <h2>Prime Watch</h2>
        <p>Style On Your Time</p>
        <a href="https://search.google.com/local/writereview?placeid=ChIJMeyBNABP4DsRBvApjZALgBY" target="_blank" rel="noopener noreferrer">Review us on Google</a>
        <a href="https://www.instagram.com/prime.watch.surat" target="_blank" rel="noopener noreferrer">Follow on Instagram</a>
        <a href="https://wa.me/919327155055" target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a>
      </div>
    </noscript>

    <!-- Loading State -->
    <div id="loading" class="loading-state" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading profile...</p>
    </div>

    <!-- Main Content -->
    <main id="content" class="content-wrapper" style="display: none;">
      <header class="business-header">
        <div id="logo-container" class="profile-avatar-wrap">
          <!-- Real clean timepiece icon SVG -->
          <svg class="avatar-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="7"></circle>
            <polyline points="12 9 12 12 13.5 13.5"></polyline>
            <path d="M16.51 17.35l-.35 3.83a2 2 0 0 1-2 1.82H9.83a2 2 0 0 1-2-1.82l-.35-3.83"></path>
            <path d="M7.49 6.65l.35-3.83A2 2 0 0 1 9.83 1h4.34a2 2 0 0 1 2 1.82l.35 3.83"></path>
          </svg>
        </div>

        <div class="title-row">
          <h1 id="business-name" class="business-title">Prime Watch</h1>
          <!-- Verified checkmark badge icon -->
          <svg class="verified-icon" viewBox="0 0 24 24" aria-label="Verified Business">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>

        <p id="business-tagline" class="business-tagline">STYLE ON YOUR TIME</p>
        <p class="business-desc">Connect with Prime Watch Surat. Leave a review or contact us directly.</p>
      </header>

      <!-- Action Links Stack -->
      <section id="links-container" class="links-section" aria-label="Quick Actions">
        <!-- Action cards rendered via script.js -->
      </section>

      <!-- Direct Review Fallback Section -->
      <div id="direct-review-fallback" class="direct-fallback" style="display: none;" role="region" aria-label="Review Redirection">
        <h2>Redirecting to Google Review...</h2>
        <p class="direct-subtext">You should be redirected automatically in a moment.</p>
        <a id="direct-review-link" href="#" class="btn-redirect" rel="noopener noreferrer">Click here to continue</a>
      </div>

      <footer class="site-footer">
        <p class="footer-copy">Prime Watch Surat</p>
      </footer>
    </main>

    <!-- Error State -->
    <div id="error-state" class="error-state" style="display: none;" role="alert">
      <h2>Notice</h2>
      <p id="error-message">Unable to load business details.</p>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
